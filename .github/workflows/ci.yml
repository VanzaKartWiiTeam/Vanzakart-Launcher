name: CI

on:
  push:
    branches: [main, master, tauri-refactoring]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # La CI non deve mai fallire per un warning ignorato.
  RUSTFLAGS: -D warnings

jobs:
  # ── Controlli veloci: girano una sola volta, su Linux ────────────────────
  quality:
    name: Formattazione, lint e test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Il progetto sta nella radice del repository oppure dentro
      # `tauri-launcher/`, a seconda di quale dei due repository si pubblica.
      # Il workflow se ne accorge da solo, così funziona in entrambi.
      - name: Trova la cartella del progetto
        id: progetto
        shell: bash
        run: |
          if [ -f tauri-launcher/package.json ]; then
            echo "dir=tauri-launcher" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Dipendenze di sistema per Tauri
        run: |
          sudo apt-get update
          # libudev: `gilrs`, cioè i controller. libdbus: `tao`, la finestra.
          # Senza, la build muore in fondo alla compilazione con un errore di
          # pkg-config che non nomina nessuno dei due.
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev libudev-dev libdbus-1-dev
          # L'indicatore di sistema esiste in due varianti e `libappindicator-sys`
          # cerca l'una o l'altra secondo come è stato compilato: si prova a
          # installarle entrambe, e se una non c'è si tira avanti con l'altra.
          sudo apt-get install -y libayatana-appindicator3-dev || true
          sudo apt-get install -y libappindicator3-dev || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.progetto.outputs.dir }} -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.progetto.outputs.dir }}/package-lock.json

      - run: npm ci
        working-directory: ${{ steps.progetto.outputs.dir }}

      # Il frontend va costruito prima di toccare Rust: `generate_context!`
      # legge `frontendDist`, che deve esistere.
      - name: Lint del frontend
        working-directory: ${{ steps.progetto.outputs.dir }}
        run: npm run lint

      - name: Type-check del frontend
        working-directory: ${{ steps.progetto.outputs.dir }}
        run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings

      - name: Test del frontend
        working-directory: ${{ steps.progetto.outputs.dir }}
        run: npx vitest run

      - name: Build del frontend
        working-directory: ${{ steps.progetto.outputs.dir }}
        run: npx vite build

      # Anche quello dell'installer: `generate_context!` legge `frontendDist`,
      # e `cargo clippy --workspace` compila pure `vanzakart-setup`.
      - name: Build del frontend dell'installer
        working-directory: ${{ steps.progetto.outputs.dir }}
        run: npx vite build --config vite.setup.config.ts

      - name: Formattazione Rust
        working-directory: ${{ steps.progetto.outputs.dir }}
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: ${{ steps.progetto.outputs.dir }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: ${{ steps.progetto.outputs.dir }}
        run: cargo test --workspace

      - name: Audit delle dipendenze npm
        working-directory: ${{ steps.progetto.outputs.dir }}
        run: npm audit --audit-level=high

  # ── Build dei pacchetti per ogni piattaforma ─────────────────────────────
  bundle:
    name: Pacchetto ${{ matrix.label }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
            # Su Windows l'installer si distribuisce come singolo .exe.
            setupArgs: --no-bundle
          - label: macOS universale
            os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin --bundles dmg,app
            setupArgs: --target universal-apple-darwin --bundles dmg
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
            setupArgs: --bundles appimage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Trova la cartella del progetto
        id: progetto
        shell: bash
        run: |
          if [ -f tauri-launcher/package.json ]; then
            echo "dir=tauri-launcher" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Dipendenze di sistema per Tauri
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          # libudev: `gilrs`, cioè i controller. libdbus: `tao`, la finestra.
          # Senza, la build muore in fondo alla compilazione con un errore di
          # pkg-config che non nomina nessuno dei due.
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev libudev-dev libdbus-1-dev
          # L'indicatore di sistema esiste in due varianti e `libappindicator-sys`
          # cerca l'una o l'altra secondo come è stato compilato: si prova a
          # installarle entrambe, e se una non c'è si tira avanti con l'altra.
          sudo apt-get install -y libayatana-appindicator3-dev || true
          sudo apt-get install -y libappindicator3-dev || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.progetto.outputs.dir }} -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.progetto.outputs.dir }}/package-lock.json

      - run: npm ci
        working-directory: ${{ steps.progetto.outputs.dir }}

      # `platform/macos.rs` e `platform/windows.rs` per il compilatore su Linux
      # non esistono: un lint lì dentro passerebbe indenne il job `quality`,
      # che gira solo su Linux, e salterebbe fuori al primo rilascio.
      - name: Clippy della piattaforma
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        working-directory: ${{ steps.progetto.outputs.dir }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build del pacchetto
        working-directory: ${{ steps.progetto.outputs.dir }}
        run: npx tauri build ${{ matrix.args }}
        env:
          # Le firme sono facoltative: senza segreti la build riesce comunque,
          # ma i pacchetti non sono aggiornabili automaticamente (release.md §5).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Firma del codice macOS e notarizzazione.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # L'installer non ha bisogno di firme: non si aggiorna da solo, lo si
      # riscarica dal sito. Si costruisce dopo il launcher perché riusa la
      # stessa cache di cargo.
      - name: Build dell'installer
        working-directory: ${{ steps.progetto.outputs.dir }}/setup
        run: npx tauri build ${{ matrix.setupArgs }}

      - name: Pubblica gli artefatti
        uses: actions/upload-artifact@v4
        with:
          name: vanzakart-launcher-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          # I pacchetti finiscono nella cartella `target` del workspace, non
          # in `src-tauri/target`: `src-tauri` è un membro del workspace, e
          # cargo scrive in un solo posto per tutti.
          path: |
            ${{ steps.progetto.outputs.dir }}/target/**/release/bundle/nsis/*.exe
            ${{ steps.progetto.outputs.dir }}/target/**/release/bundle/nsis/*.sig
            ${{ steps.progetto.outputs.dir }}/target/**/release/bundle/dmg/*.dmg
            ${{ steps.progetto.outputs.dir }}/target/**/release/bundle/macos/*.tar.gz
            ${{ steps.progetto.outputs.dir }}/target/**/release/bundle/macos/*.sig
            ${{ steps.progetto.outputs.dir }}/target/**/release/bundle/appimage/*.AppImage
            ${{ steps.progetto.outputs.dir }}/target/**/release/bundle/appimage/*.sig
            ${{ steps.progetto.outputs.dir }}/target/**/release/bundle/deb/*.deb
            ${{ steps.progetto.outputs.dir }}/target/release/vanzakart-setup.exe
