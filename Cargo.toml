[workspace]
resolver = "2"
members = [
    "crates/vk-core",
    "crates/vk-dolphin",
    "crates/vk-elevate",
    "crates/vk-install",
    "crates/vk-mii-render",
    "crates/vk-save",
    "src-tauri",
    "setup/src-tauri",
]

[workspace.package]
version = "2.2.2"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["VanzaKart"]
repository = "https://github.com/cripsum/vanzakart-launcher"

[workspace.dependencies]
vk-core = { path = "crates/vk-core" }
vk-dolphin = { path = "crates/vk-dolphin" }
vk-elevate = { path = "crates/vk-elevate" }
vk-install = { path = "crates/vk-install" }
vk-mii-render = { path = "crates/vk-mii-render" }
vk-save = { path = "crates/vk-save" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "charset",
    "http2",
] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "time"] }
# Payload macOS: i bundle `.app` viaggiano come tar.gz, l'unico formato che
# preserva permessi e symlink interni al bundle.
flate2 = "1"
tar = "0.4"
tempfile = "3"
dirs = "5"
url = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
sysinfo = "0.32"
gilrs = "0.11"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
# Il debug info completo su Windows rallenta molto il link del bundle Tauri.
debug = 1

# Il rasterizzatore dei Mii fa milioni di operazioni per immagine: senza
# ottimizzazioni un render passa da pochi millisecondi a mezzo secondo, e
# l'editor torna lento anche in sviluppo. In release si preferisce la velocità
# alla dimensione, solo per questo crate.
[profile.dev.package.vk-mii-render]
opt-level = 3

# Ogni anteprima diventa un PNG: la compressione non ottimizzata raddoppiava
# il tempo di un render in sviluppo.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.release.package.vk-mii-render]
opt-level = 3
