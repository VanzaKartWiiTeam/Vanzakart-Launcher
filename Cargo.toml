[workspace]
resolver = "2"
members = ["crates/vk-core", "crates/vk-dolphin", "crates/vk-save", "src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["VanzaKart"]
repository = "https://github.com/cripsum/vanzakart-launcher"

[workspace.dependencies]
vk-core = { path = "crates/vk-core" }
vk-dolphin = { path = "crates/vk-dolphin" }
vk-save = { path = "crates/vk-save" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "charset",
    "http2",
] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "time"] }
tempfile = "3"
dirs = "5"
url = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
sysinfo = "0.32"
gilrs = "0.11"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
# Il debug info completo su Windows rallenta molto il link del bundle Tauri.
debug = 1
